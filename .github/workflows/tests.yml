name: LabLedger pull-request tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Visible contract tests (starter defects are expected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run the visible tests
        id: pytest
        continue-on-error: true
        run: python -m pytest -q --junitxml=pytest-report.xml
      - name: Publish test counts
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path("pytest-report.xml")
          if not report.exists():
              summary = "## Test report\n\nNo report was produced. Check setup and test logs.\n"
          else:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              total = sum(int(s.attrib.get("tests", 0)) for s in suites)
              failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
              errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
              skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
              passed = total - failures - errors - skipped
              summary = f"## Test report\n\n- Total: {total}\n- Passed: {passed}\n- Failed: {failures}\n- Errors: {errors}\n- Skipped: {skipped}\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          print(summary)
          PY
      - name: Keep the test check red while tests fail
        if: steps.pytest.outcome == 'failure'
        run: exit 1
